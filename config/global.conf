# ==============================================================================
# Nmap Multi V2: 글로벌 실행 제어 및 모듈별 피처 토글 설정
# ==============================================================================
# 시간이 흐른 뒤에도 각 설정값의 역할을 쉽게 파악할 수 있도록 작성된 가이드라인입니다.

# [1. 네트워크 및 동시성 제어 설정]

# USE_SUBNET_LOCK (기본값: false)
# - 동일한 LTE 서브넷(모뎀) 대역을 공유하는 단말기들이 동시에 네트워크 기상을 시도하지 못하게 스태거(순차) 제어합니다.
# - true 설정 시, 같은 서브넷 내 기기들의 호출 간격이 STAGGER_DELAY_SEC 만큼 강제로 지연 분산됩니다.
USE_SUBNET_LOCK=true

# STAGGER_DELAY_SEC (단위: 초, 기본값: 2)
# - 단말기 간의 가동 시차를 지연시키는 설정입니다.
# - 단말기를 순차적으로 실행하여 호스트 CPU 스파이크(부하 급증) 및 캡차 발생 확률을 억제합니다.
STAGGER_DELAY_SEC=2

# QOS_GUARD (기본값: true)
# - 무선 LTE 회선의 트래픽 제약(QoS)과 지도 앱 캐시 제한을 방어합니다.
# - true 설정 시, 단말 초기화 및 캐시 정리 중 네이버 지도 캐시의 주요 오프라인 파일들이 격리 보존됩니다.
QOS_GUARD=true

# STALE_TASK_TIMEOUT (단위: 초, 기본값: 1200 - 약 20분)
# - 실행 중 멈춤 상태(좀비 프로세스)로 감지되는 proxy_manager.py 작업의 강제 타임아웃 임계값입니다.
# - 지정된 시간(초)을 초과한 작업은 스케줄러가 자동으로 프로세스를 강제 종료(Kill)하고 자원을 반납합니다.
STALE_TASK_TIMEOUT=1200


# [2. 모듈 피처 토글 - 개발 및 수동 디버깅용 설정]
# - 특정 단계만 켜고 끄며 독립적으로 시나리오를 테스트할 수 있게 해줍니다.

# USE_PROXY (기본값: true)
# - 네이버 지도의 웹뷰 트래픽 검열 및 SSAID/ADID 치환(익명화)을 위한 프록시 연동 여부입니다.
# - true: 백그라운드에서 mitmdump(addon.py)를 구동하고, 단말기의 http_proxy를 127.0.0.1로 강제 설정하여 패킷 차단 및 위조를 수행합니다.
# - false: 프록시 서버 구동 및 단말기 프록시 등록 단계를 전부 생략하여 로컬 직통 인터넷으로 동작하게 합니다.
USE_PROXY=true

# USE_FRIDA (기본값: true)
# - WebView SSL 인증서 핀해제(Pinning Bypass) 및 보안 감지 방어를 위한 Frida 연동 여부입니다.
# - true: 기기 안의 frida-server 포트 포워딩을 수행하고, 실행 중인 지도 앱 프로세스에 후킹 스크립트(network_hook.js 등)를 인젝션합니다.
# - false: 프리다 데몬 연결 및 훅 스크립트 주입 단계를 모두 생략합니다.
USE_FRIDA=true

# USE_GPS (기본값: true)
# - 도착 시간에 비례한 dynamic 속도 기반 모의 GPS 시뮬레이터 구동 여부입니다.
# - true: 단말기에 시작 좌표 인젝션 후, 백그라운드 스레드로 매 프레임 좌표를 이동시키는 gps_simulator.py를 기동합니다.
# - false: 모의 위치 강제 삽입 로직을 사용하지 않습니다.
USE_GPS=true

# USE_MACRO (기본값: true)
# - 네이버 지도 GUI 오토매이션 시나리오(검색어 입력, 길찾기 안내시작 클릭 등) 구동 여부입니다.
# - true: 백그라운드 UIAutomator 클릭커(executor.py)를 실행하여 GUI 자동화를 제어합니다.
# - false: 매크로 클릭커를 실행하지 않습니다. (단말 화면을 직접 눈으로 보며 수동으로 조작/테스트하고 싶을 때 false로 설정합니다.)
USE_MACRO=true


# ENABLE_TRAFFIC_SAVER (기본값: false)
# - 3D 건물 GLB 타일 모델, 음성 TTS 파일, 대형 광고/팝업 등 대용량 트래픽 리소스의 획기적 절감을 제어합니다.
# - true: mitmproxy(addon.py)에서 유효타(검색/경로/GQL)에 영향을 주지 않는 대용량 미디어/타일 패킷을 HTTP 200 (Content-Length: 0)으로 응답 처리하여 다운로드를 안 받아 트래픽을 극대화(최대 80~90% 절감)합니다.
# - false: 모든 타일 및 미디어 리소스를 정상 다운로드합니다.
ENABLE_TRAFFIC_SAVER=true


# API_SERVER (Tailscale 암호화 전용 사설망 주소: 100.65.34.98:8013)
# - 단말 가동 정보 전송, 실시간 모니터 동기화 및 주행 시나리오 정보를 인출해오는 중앙 관제 서버 주소(IP:PORT)입니다.
API_SERVER=100.65.34.98:8013
